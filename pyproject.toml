[project]
name = "krfb-virtualmonitor-gui"
version = "0.1.0"
description = "Desktop GUI for krfb-virtualmonitor — manage KDE's virtual displays on Wayland/KWin"
readme = "README.md"
# SPDX 标识（PEP 639）。想收窄成"仅第 3 版"就改成 "GPL-3.0-only"。
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["krfb", "vnc", "virtual-monitor", "wayland", "kwin", "kde", "qt6", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
]
dependencies = [
    # 密码存储有三个后端（KDE 钱包 / 系统 Secret Service / 内置加密库）：
    #   * KDE 钱包走原生 D-Bus（org.kde.KWallet），不再用 keyring —— 它的 KWallet
    #     后端需要 dbus-python（要编译），而且只支持 kwalletd5；直接调 D-Bus 更简单，
    #     jeepney 是纯 Python 的；
    #   * 系统密钥环那个后端用 secretstorage；
    #   * 内置加密库用 cryptography 的 Fernet（AES-128-CBC + HMAC），密钥用
    #     hashlib.scrypt 从主密码派生。
    "cryptography>=43",
    "jeepney>=0.8",
    "pyside6-essentials>=6.12.0",
    "secretstorage>=3.5.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
