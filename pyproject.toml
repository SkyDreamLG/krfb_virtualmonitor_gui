[project]
name = "krfb-virtualmonitor-gui"
version = "0.1.0"
description = "Desktop GUI for krfb-virtualmonitor — manage KDE's virtual displays on Wayland/KWin"
readme = "README.md"
# SPDX 标识（PEP 639）。想收窄成"仅第 3 版"就改成 "GPL-3.0-only"。
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["krfb", "vnc", "virtual-monitor", "wayland", "kwin", "kde", "qt6", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
]
dependencies = [
    # 密码存储走 KDE 钱包的原生 D-Bus 接口（org.kde.KWallet）。
    # 不再用 keyring：它的 KWallet 后端需要 dbus-python（要编译），而且只支持
    # kwalletd5；直接调 D-Bus 反而更简单，jeepney 是纯 Python 的。
    "jeepney>=0.8",
    "pyside6-essentials>=6.12.0",
    # 只用于一次性迁移：把旧版本存在 freedesktop Secret Service 里的密码搬进
    # KDE 钱包（见 krfb_gui/secrets.py 的 _import_legacy）。搬完就用不到了。
    "secretstorage>=3.5.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
